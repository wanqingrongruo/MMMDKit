name: MMMDKitSwiftUIDemo
options:
  bundleIdPrefix: com.mmmdkit.demo
  deploymentTarget:
    iOS: "15.0"
    macOS: "12.0"
settings:
  base:
    SWIFT_VERSION: "5.7"
    DEVELOPMENT_TEAM: ""
packages:
  MMMDKit:
    path: ../../MMMDKit
targets:
  MMMDKitSwiftUIDemo-iOS:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: SwiftUIDemoApp.swift
      - path: Resources
    dependencies:
      - package: MMMDKit
        product: MMMDKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mmmdkit.demo.swiftui.ios
        INFOPLIST_FILE: Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
  MMMDKitSwiftUIDemo-macOS:
    type: application
    platform: macOS
    deploymentTarget: "12.0"
    sources:
      - path: SwiftUIDemoApp.swift
      - path: Resources
    dependencies:
      - package: MMMDKit
        product: MMMDKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mmmdkit.demo.swiftui.mac
        INFOPLIST_FILE: Info.plist
schemes:
  MMMDKitSwiftUIDemo-iOS:
    build:
      targets:
        MMMDKitSwiftUIDemo-iOS: all
    run:
      config: Debug
  MMMDKitSwiftUIDemo-macOS:
    build:
      targets:
        MMMDKitSwiftUIDemo-macOS: all
    run:
      config: Debug
